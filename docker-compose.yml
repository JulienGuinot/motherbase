# One-command local/VPS stack: API + PostgreSQL + MinIO (S3-compatible storage).
#
# Driven by ./setup.sh, which generates .env and brings this up.
# Manual use: docker compose up -d --build
#
# Secrets (JWT_SECRET, CONFIG_ENCRYPTION_KEY, S3 creds, SEED_ADMIN_*) come from
# .env via `env_file`. Container-internal hostnames (db, minio) are forced in the
# `environment:` block below, which overrides whatever .env says, so the same
# .env works for both host tooling (localhost) and the containers (service names).
services:
  db:
    image: motherbase-postgres:1.0.0
    build:
      context: .
      dockerfile: deploy/postgres.Dockerfile
    command: ['postgres', '-c', 'shared_preload_libraries=pg_cron,pg_stat_statements', '-c', 'cron.database_name=app']
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: app
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - '127.0.0.1:${MINIO_PORT:-59000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-59001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:9000/minio/health/live >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create a private bucket (no anonymous access) and a separate
  # public bucket that is anonymously downloadable, then exit.
  createbuckets:
    image: bitnamilegacy/minio-client:2025.5.21
    # mc keeps its config under $HOME; the image's HOME (/) is not writable.
    environment:
      HOME: /tmp
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin};
      mc mb --ignore-existing local/${S3_BUCKET:-uploads};
      mc anonymous set none local/${S3_BUCKET:-uploads};
      mc mb --ignore-existing local/${S3_PUBLIC_BUCKET:-public};
      mc anonymous set download local/${S3_PUBLIC_BUCKET:-public};
      echo 'buckets ready';
      "

  # Runs edge functions (see docker-compose.prod.yml). Only the API shares
  # its network, so operator code has no route to Postgres or MinIO.
  edge-runtime:
    image: ${EDGE_RUNTIME_IMAGE:-motherbase-edge-runtime:1.0.0}
    build:
      context: .
      dockerfile: deploy/edge-runtime.Dockerfile
    restart: unless-stopped
    environment:
      EDGE_RUNTIME_PORT: 9000
      DENO_DIR: /tmp/deno-dir
      # Unset only blocks this service: it refuses to start, and `npm run infra` still works.
      EDGE_RUNTIME_TOKEN: ${EDGE_RUNTIME_TOKEN:-dev-edge-runtime-token}
      EDGE_ALLOWED_INTERNAL_ORIGINS: http://api:5001
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      edge-runtime:
        condition: service_started
    # Pull secrets and app config from the generated .env.
    env_file:
      - .env
    # Force container-internal wiring (overrides .env's localhost values).
    environment:
      NODE_ENV: production
      PORT: 5001
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/app?schema=public
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      EDGE_RUNTIME_URL: http://edge-runtime:9000
      EDGE_RUNTIME_TOKEN: ${EDGE_RUNTIME_TOKEN:-dev-edge-runtime-token}
      EDGE_RUNTIME_CALLBACK_URL: http://api:5001
    ports:
      - '127.0.0.1:5001:5001'
    networks:
      - default
      - edge

volumes:
  db_data:
  minio_data:

networks:
  edge:
