user root;

events {
    worker_connections 64;
}

http {
    upstream docker_socket {
        server unix:/var/run/docker.sock;
    }

    server {
        listen 2375;

        # Rewrite any API version (e.g. /v1.24/...) to the version the
        # daemon actually requires, then forward to the Docker Unix socket.
        location ~ ^/v[0-9]+\.[0-9]+/(.*)$ {
            rewrite ^/v[0-9]+\.[0-9]+/(.*)$ /v1.45/$1 break;
            proxy_pass         http://docker_socket;
            proxy_http_version 1.1;
            proxy_set_header   Host $http_host;
            proxy_set_header   Connection "";
            proxy_buffering    off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass         http://docker_socket;
            proxy_http_version 1.1;
            proxy_set_header   Host $http_host;
            proxy_set_header   Connection "";
            proxy_buffering    off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
